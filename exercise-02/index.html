<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corrientes Somáticas · Natación</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <div id="canvas-container" aria-label="Visualización generativa de sesiones de natación"></div>
    <aside class="overlay" aria-live="polite">
      <p class="kicker">STRAVA × HUAWEI HEALTH / CUERPO EN AGUA</p>
      <h1>Corrientes somáticas</h1>
      <div class="metrics">
        <span><b id="session-id">ACT_----</b> SESIÓN</span>
        <span><b id="heart-rate">---</b> PPM</span>
        <span><b id="swolf">---</b> SWOLF</span>
        <span><b id="active-lap">-- × --</b> VUELTAS</span>
      </div>
      <p id="session-detail" class="detail">Cargando memoria corporal…</p>
      <p class="instruction">← → / CLICK &nbsp; RECORRER SECUENCIA</p>
    </aside>
    <script src="./main.js"></script>
  </body>
</html>
