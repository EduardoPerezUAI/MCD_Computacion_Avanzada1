<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Progreso Natación</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
    <div id="canvas-container" aria-label="Visualización generativa de sesiones de natación"></div>
    <aside class="overlay" aria-live="polite">
      <div class="control-stack">
        <div class="title-block">
          <p class="kicker">STRAVA × HUAWEI HEALTH / CUERPO EN AGUA</p>
          <h1>Progreso Natación</h1>
        </div>
        <label for="playback-speed">VELOCIDAD <output id="speed-value">1.00×</output></label>
        <input id="playback-speed" type="range" min="0.25" max="3" value="1" step="0.05" />

        <label for="event-spacing">ESPACIADO <output id="spacing-value">1.00 (Secuencial)</output></label>
        <input id="event-spacing" type="range" min="0" max="1" value="1" step="0.01" />

        <label for="time-scrubber">TIEMPO <output id="time-value">00:00 / 00:00</output></label>
        <input id="time-scrubber" type="range" min="0" max="1000" value="0" step="1" />

        <div class="button-row">
          <button id="btn-play" type="button" class="ctrl-btn">PAUSAR</button>
          <button id="btn-reset" type="button" class="ctrl-btn">REINICIAR</button>
        </div>

        <div class="speed-legend">
          <span class="legend-title">RITMO / VELOCIDAD</span>
          <div class="legend-gradient"></div>
          <div class="legend-labels">
            <span>MORADO<br><em>Lento</em></span>
            <span>AZUL<br><em>Medio</em></span>
            <span>AMARILLO<br><em>Rápido</em></span>
          </div>
        </div>
      </div>
      <p class="instruction">ESPACIO: PLAY/PAUSA &nbsp;·&nbsp; SLIDER TIEMPO: AVANZAR/RETROCEDER</p>
    </aside>
    <script src="./main.js"></script>
  </body>
</html>
